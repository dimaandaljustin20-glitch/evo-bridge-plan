:root{

  --serif:"Instrument Serif","Iowan Old Style","Times New Roman",serif;

  --gl-inset:inset 0 1.5px 0 rgba(255,255,255,.5),inset 1.5px 0 1px -1px rgba(255,255,255,.34),inset 0 -1.5px 1px -1px rgba(255,255,255,.22),inset -1.5px 0 1px -1px rgba(255,255,255,.16);

  --gp-ink:#0a0908;
  --gp-shadow:0 16px 32px -14px rgba(0,0,0,.8),0 2px 6px rgba(0,0,0,.35),0 0 0 1px rgba(255,255,255,.08);
  --gp-inset:inset 0 2px 0 #fff,inset 1.5px 0 1px -1px rgba(255,255,255,.9),inset 0 -3px 5px -2px rgba(120,96,70,.28),inset -1.5px 0 1px -1px rgba(255,255,255,.5);
}
html[data-theme="light"]{

  --line:rgba(40,24,10,.11); --line2:rgba(40,24,10,.22);
  --ink:#16110d; --ink2:#3b322b; --mute:#6a6057;

*{box-sizing:border-box}

ul,ol,dl,dd{margin:0;padding:0;list-style:none}
button{font:inherit;color:inherit}

:focus-visible{outline:2px solid var(--acct);outline-offset:3px}

.wrap{max-width:1200px;margin:0 auto;padding:0 var(--pad)}

/* ---------- the bits everything is made of ---------- */

}
.it{font-family:var(--serif);font-style:italic;font-weight:400;font-size:1.1em;letter-spacing:-.015em;line-height:.92;padding:.04em .12em .16em 0}
.h2{font-size:clamp(2.2rem,5vw,3.9rem);letter-spacing:-.05em;line-height:1.02}
.h3x{font-size:clamp(1.6rem,3vw,2.2rem);letter-spacing:-.04em}
.lede{font-size:clamp(1.05rem,1.6vw,1.22rem);color:var(--ink2);max-width:62ch}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);padding:28px}

.tags{display:flex;flex-wrap:wrap;gap:8px}
.tag{display:inline-flex;align-items:center;min-height:30px;padding:5px 14px;border-radius:15px;border:1px solid var(--line2);font-size:13.5px;font-weight:500;line-height:1.2;color:var(--ink2);white-space:nowrap}
.tag.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.tag.hot{color:var(--acct);border-color:color-mix(in srgb,var(--acc) 55%,transparent);background:color-mix(in srgb,var(--acc) 12%,transparent)}
.tag.ok{color:var(--moss);border-color:color-mix(in srgb,var(--moss) 55%,transparent)}

.badge{display:inline-flex;align-items:center;gap:10px;min-height:34px;padding:5px 16px;border:1px solid var(--line2);border-radius:99px;background:color-mix(in srgb,var(--card) 60%,transparent);font-size:14px;font-weight:500;color:var(--ink2)}

/* glass pills. The orange circle is the "press me" mark. */
.orb{display:inline-grid;place-items:center;width:42px;height:42px;border-radius:50%;flex:none;color:#fff;transition:transform .2s;
  background:linear-gradient(180deg,#f9783a,#e85a1c);

  background:var(--gl-fill);-webkit-backdrop-filter:blur(16px) saturate(1.7);backdrop-filter:blur(16px) saturate(1.7);border:1px solid var(--gl-rim);box-shadow:var(--gl-inset),var(--gl-shadow);

/* ---------- top bar ---------- */
.bar{position:sticky;top:0;z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);border-bottom:1px solid var(--line);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px)}
.bar-in{display:flex;align-items:center;gap:14px;height:66px}
.brand{font-weight:600;font-size:17px;letter-spacing:-.02em;color:var(--ink);text-decoration:none;white-space:nowrap}

.nav{display:flex;gap:4px;margin:0 auto}

.mode{width:40px;height:40px;border-radius:50%;border:1px solid var(--line2);background:none;display:grid;place-items:center;cursor:pointer;flex:none}

.heroin{position:relative;padding:76px 0 60px}
.intro{max-width:980px}
.intro .badge{margin-bottom:28px}
.h1{font-size:clamp(2.5rem,6.6vw,5.5rem);letter-spacing:-.058em;line-height:.98}
.h1 .it{display:block;margin-top:.04em}
.intro .lede{margin-top:26px}
.ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:34px}

.bridge{display:grid;grid-template-columns:minmax(180px,230px) 1fr minmax(180px,230px);margin-top:70px}
.tower{position:relative;height:230px;display:flex;flex-direction:column;gap:6px;padding:22px;border-radius:24px;border:1px solid var(--line2);background:color-mix(in srgb,var(--card) 82%,transparent);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.tower .tn{font-size:14.5px;font-weight:500;color:var(--mute)}
.tower b{font-size:clamp(1.25rem,2vw,1.6rem);font-weight:500;letter-spacing:-.035em;line-height:1.1}
.tower .tnote{margin-top:auto;font-size:14.5px;color:var(--ink2)}
.tower.r{border-color:color-mix(in srgb,var(--acc) 60%,transparent);background:linear-gradient(180deg,color-mix(in srgb,var(--acc) 16%,var(--card)),var(--card))}

.bnode{position:absolute;width:40px;height:40px;margin:-20px 0 0 -20px;padding:0;border:0;background:none;cursor:pointer}
.bnode .orb{width:40px;height:40px}
.bnode .orb svg{transform:rotate(90deg)}
.bnode:hover .orb{transform:translateY(2px)}
.bnode.on .orb{box-shadow:inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -2px 3px rgba(120,30,0,.32),0 0 0 5px color-mix(in srgb,var(--acc) 30%,transparent)}

.hint{margin-top:22px;font-size:14.5px;color:var(--mute);text-align:center}

/* ---------- sections ---------- */
.sec{padding:112px 0 0}
.sec.tight{padding-top:72px}
.sec.last{padding-bottom:112px}

/* what changed */
.shift{display:grid;gap:18px;padding:30px;border-radius:var(--r);border:1px solid var(--line)}

/* chart */
.chart{margin:0;padding:28px 26px 22px}

.b .col{flex:1;width:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center}

.b.best .col i{background:linear-gradient(180deg,var(--tan),var(--acc))}

.call{flex:none;margin-bottom:8px;font-size:13px;font-weight:500;white-space:nowrap;color:var(--tan)}

.years{display:flex;gap:clamp(6px,1.4vw,18px);margin-top:10px}
.years span{padding-top:8px;border-top:1px solid var(--line2);text-align:center;font-size:13.5px;font-weight:500;color:var(--mute)}
.chart figcaption{margin-top:18px;font-size:14.5px;line-height:1.5;color:var(--mute);max-width:80ch}
.finds{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin:16px 0 18px}
.find{display:flex;flex-direction:column;gap:10px}
.find h3{margin:0}
.big{font-size:clamp(2.6rem,5.6vw,4rem);font-weight:500;letter-spacing:-.055em;line-height:1}
.move{display:flex;gap:10px;align-items:baseline;margin-top:auto;padding-top:16px;border-top:1px solid var(--line);color:var(--ink)!important;font-weight:500}

/* strategy */
.moves{display:grid;grid-template-columns:repeat(3,1fr);gap:16px}
.mv{display:flex;flex-direction:column;gap:12px}

.loop{position:relative;width:min(100%,400px);aspect-ratio:1;margin:0 auto}

.loop .track{fill:none;stroke:var(--line2);stroke-width:1.2}
.loop .runner{fill:none;stroke:var(--acct);stroke-width:2.2;stroke-linecap:round;stroke-dasharray:46 470;animation:run 10s linear infinite}
@keyframes run{to{stroke-dashoffset:-516}}
.ln{position:absolute;transform:translate(-50%,-50%);padding:8px 16px;border-radius:99px;background:var(--card2);border:1px solid var(--line2);font-size:14.5px;font-weight:500;white-space:nowrap}
.ln.door{border-color:color-mix(in srgb,var(--acc) 65%,transparent);color:var(--acct)}

.notwk{display:grid;gap:14px;margin-top:40px}
.notwk h3{font-size:1.28rem}

/* math */
.slots{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}
.slot{position:relative;display:grid;gap:2px;padding:18px 18px 16px;border-radius:22px;border:1.5px dashed var(--line2);color:var(--mute);transition:background .3s,border-color .3s}

.slot .sk svg{width:60%;height:60%}

.need dd{color:var(--ink2)}
.dots{display:grid;gap:12px}
.dots li{position:relative;padding-left:20px;color:var(--ink2)}
.dots li::before{content:"";position:absolute;left:0;top:.62em;width:7px;height:7px;border-radius:50%;background:var(--tan)}
.capc{border-color:color-mix(in srgb,var(--moss) 40%,transparent)}

/* week */
.daytabs{display:flex;gap:6px;padding:6px;border-radius:99px;border:1px solid var(--gl-rim);background:var(--gl-fill);box-shadow:var(--gl-inset);overflow-x:auto;scrollbar-width:none}
.daytabs::-webkit-scrollbar{display:none}
.dtab{position:relative;flex:1;min-width:62px;height:56px;border:0;border-radius:99px;background:none;display:grid;place-content:center;justify-items:center;gap:1px;cursor:pointer;color:var(--mute);line-height:1.1}
.dtab b{font-size:15.5px;font-weight:600;color:var(--ink2)}
.dtab span{font-size:12.5px;font-variant-numeric:tabular-nums}
.dtab[aria-selected="true"]{background:var(--ink);color:color-mix(in srgb,var(--bg) 70%,var(--ink))}
.dtab[aria-selected="true"] b{color:var(--bg)}
.dtab.alldone::after{content:"";position:absolute;top:8px;right:calc(50% - 22px);width:7px;height:7px;border-radius:50%;background:var(--moss)}
.daypanel{margin-top:16px;padding:34px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.dayhead{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}
.dname{font-size:clamp(1.7rem,3.6vw,2.6rem);letter-spacing:-.045em;margin:6px 0 10px}
.goal{color:var(--ink2);max-width:60ch}
.prog{flex:none;font-size:14.5px;font-weight:500;color:var(--moss)}
.daybar{display:flex;gap:3px;height:34px;margin:26px 0 16px;border-radius:99px;overflow:hidden}
.daybar span{display:flex;align-items:center;min-width:0;background:var(--k)}
.daybar em{padding:0 14px;font-style:normal;font-size:13px;font-weight:600;color:#14100d;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.k-talk{--k:var(--tan)} .k-show{--k:var(--moss)} .k-make{--k:var(--slate)} .k-review{--k:var(--ink2)}
html[data-theme="light"] .daybar em{color:#fff}
.blocks{display:grid;gap:12px;margin-top:16px}
.blocks.n3{grid-template-columns:repeat(3,1fr)} .blocks.n4{grid-template-columns:repeat(4,1fr)} .blocks.n2{grid-template-columns:repeat(2,1fr)}
.blk{padding:22px;border-radius:22px;background:var(--card2)}
.blkhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px;margin-bottom:12px}
.blk h4{display:flex;align-items:center;gap:9px;font-size:1.08rem;font-weight:600;letter-spacing:-.02em}
.blk h4 i{width:9px;height:9px;border-radius:50%;background:var(--k)}
.tasks{display:grid;gap:2px}
.task{display:flex;gap:12px;align-items:flex-start;padding:8px 0;cursor:pointer}
.task input{position:absolute;opacity:0;width:1px;height:1px}
.box{flex:none;width:24px;height:24px;margin-top:1px;border-radius:8px;border:1.5px solid var(--line2);display:grid;place-items:center;color:transparent;transition:background .2s,border-color .2s}
.box svg{width:66%;height:66%}
.task input:checked + .box{background:var(--moss);border-color:var(--moss);color:var(--bg)}
.task input:focus-visible + .box{outline:2px solid var(--acct);outline-offset:2px}
.tt{font-size:16px;line-height:1.45;color:var(--ink2)}
.task input:checked ~ .tt{color:var(--mute);text-decoration:line-through}
.donewhen{display:flex;gap:14px;align-items:baseline;margin-top:20px;padding-top:20px;border-top:1px solid var(--line)}
.donewhen .tag{flex:none}
.donewhen p{color:var(--ink)}
.claude{display:flex;gap:10px;align-items:baseline;margin-top:14px;font-size:15px;color:var(--mute)}
.claude i{width:8px;height:8px;border-radius:50%;background:var(--slate);flex:none;transform:translateY(-1px)}
.weekfoot{margin-top:18px}

/* messages */
.msgwrap{padding:26px;border-radius:var(--r);border:1px solid var(--line);background:var(--card)}
.mtabs{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:24px}
.mtab{min-height:38px;padding:7px 16px;border-radius:99px;border:1px solid var(--line2);background:none;font-size:14.5px;font-weight:500;color:var(--ink2);cursor:pointer;white-space:nowrap}
.mtab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.msgpanel{display:grid;grid-template-columns:minmax(220px,320px) 1fr;gap:32px;align-items:start}
.msgside{display:grid;gap:16px}
.why{font-size:1.1rem;color:var(--ink)!important;line-height:1.45}
.bubblewrap{display:grid;gap:14px;justify-items:start}
.bubble{display:grid;gap:12px;max-width:600px;padding:22px 24px;border-radius:26px 26px 26px 8px;background:var(--card2);border:1px solid var(--line);font-size:16px;line-height:1.5}
.bubble p{color:var(--ink)}
.bubble mark{background:color-mix(in srgb,var(--acc) 24%,transparent);color:inherit;border-radius:5px;padding:0 3px}
.signals{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.sig{padding:22px;display:grid;gap:10px;align-content:start}
.sig h4{display:flex;align-items:center;gap:9px;font-size:1.08rem;font-weight:600}
.sig h4 i{width:9px;height:9px;border-radius:50%;background:var(--mute)}
.sig.go h4 i{background:var(--moss)} .sig.wait h4 i{background:var(--tan)}
.says{color:var(--mute)!important;font-size:15.5px}
.rulesrow .fine{margin-top:14px}

/* content */
.twoposts{margin-bottom:8px}
.tp{display:grid;grid-template-columns:auto 1fr 1fr;gap:14px;align-items:stretch}
.tpo{display:grid;place-items:center;padding:0 26px;border-radius:20px;border:1.5px dashed var(--line2);font-weight:500;color:var(--ink2)}
.tpp{display:grid;gap:4px;padding:18px 20px;border-radius:20px;background:var(--card2)}
.tpp b{font-size:1.12rem;font-weight:500;letter-spacing:-.02em}
.rhythm{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.ry{padding:22px;display:grid;gap:6px;align-content:start}
.ry h4{font-size:1.3rem;letter-spacing:-.03em}
.cgrid{display:grid;grid-template-columns:.85fr 1.15fr;gap:16px;margin-top:16px}
.steps{display:grid;gap:12px;counter-reset:s}
.steps li{position:relative;padding-left:34px;color:var(--ink2);counter-increment:s}
.steps li::before{content:counter(s);position:absolute;left:0;top:0;width:24px;font-weight:600;color:var(--mute);font-variant-numeric:tabular-nums}
.facts{display:grid;gap:16px;margin-bottom:16px}
.facts li{display:grid;gap:4px}
.facts span{color:var(--ink2);font-size:16px}
.facts a,.src a{color:var(--tan);text-underline-offset:3px}
.queue{display:grid;gap:10px;margin-bottom:18px}
.qi{display:grid;grid-template-columns:170px 1fr;gap:22px;padding:20px 24px;border-radius:22px;align-items:start}
.qmeta{display:grid;gap:8px;justify-items:start}
.hook{font-size:1.14rem;font-weight:500;letter-spacing:-.02em;line-height:1.35;color:var(--ink)!important}
.how{margin-top:6px;font-size:15.5px;color:var(--mute)!important}
.tag.k-proof{color:var(--tan);border-color:color-mix(in srgb,var(--tan) 50%,transparent)}
.tag.k-teach{color:var(--moss);border-color:color-mix(in srgb,var(--moss) 50%,transparent)}
.tag.k-trust{color:var(--slate);border-color:color-mix(in srgb,var(--slate) 50%,transparent)}
.tag.k-buildlog{color:var(--acct);border-color:color-mix(in srgb,var(--acc) 50%,transparent)}

/* bridge */
.stages{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.stage{display:flex;flex-direction:column;gap:10px;padding:22px;border-radius:22px;border-top:2px solid var(--line2)}
.stage.now{border-top-color:var(--acc)}
.stage h3{margin:0;font-size:1.2rem}
.stage p{font-size:15.5px}
.gate{display:flex;flex-direction:column;gap:8px;align-items:flex-start;margin-top:auto;padding-top:14px;border-top:1px solid var(--line);color:var(--ink)!important;font-weight:500}
.bgrid{display:grid;grid-template-columns:1.1fr .9fr;gap:16px;margin-top:16px}
.ladder{display:flex;align-items:flex-end;gap:10px;height:250px;margin:8px 0 22px}
.rung{flex:1;min-width:0;height:100%;display:flex;flex-direction:column;justify-content:flex-end;gap:10px}
.rung .post{height:var(--h);display:flex;justify-content:center;padding-top:12px;border-radius:14px 14px 4px 4px;background:linear-gradient(180deg,color-mix(in srgb,var(--ink) 20%,transparent),color-mix(in srgb,var(--ink) 6%,transparent))}
.rung .post b{font-size:clamp(.95rem,1.5vw,1.2rem);font-weight:600;letter-spacing:-.03em}
.rung > span{min-height:3.9em;font-size:13px;line-height:1.3;color:var(--mute)}
.rung.hot .post{background:linear-gradient(180deg,var(--acc),color-mix(in srgb,var(--acc) 22%,transparent))}
.rung.hot .post b{color:#fff}
.rung.hot > span{color:var(--ink)}
.rung.dim .post{background:none;border:1.5px dashed var(--line2)}
.gap{color:var(--ink2);margin-top:6px}
.gap + .fine{margin-top:10px}

/* scoreboard */
.score{display:grid;grid-template-columns:repeat(5,1fr);gap:12px}
.sc{padding:20px;display:grid;gap:12px;border-radius:22px}
.sc label{font-size:15px;font-weight:500;color:var(--ink2)}
.scrow{display:flex;align-items:center;gap:6px}
.qb{flex:none;width:36px;height:36px;border-radius:50%;border:1px solid var(--line2);background:none;font-size:20px;line-height:1;cursor:pointer;display:grid;place-items:center}
.qb:hover{border-color:var(--ink2)}
.scval{flex:1;min-width:0;display:flex;align-items:baseline;justify-content:center}
.scval .cur{font-size:1.2rem;color:var(--mute)}
.scval input{width:100%;min-width:0;border:0;background:none;color:var(--ink);font:500 2rem/1 var(--sans);letter-spacing:-.04em;text-align:center;font-variant-numeric:tabular-nums;-moz-appearance:textfield;appearance:textfield;padding:2px 0}
.scval .cur + input{flex:none;width:1.6ch}
.scval input::-webkit-outer-spin-button,.scval input::-webkit-inner-spin-button{-webkit-appearance:none;margin:0}
.meter{height:6px;border-radius:99px;background:var(--line);overflow:hidden}
.meter i{display:block;height:100%;width:0;border-radius:99px;background:var(--moss);transition:width .4s}
.meter.ghostm i{background:var(--tan)}
.sc.hit{border-color:color-mix(in srgb,var(--moss) 55%,transparent)}
.scorefoot{display:flex;justify-content:space-between;align-items:baseline;gap:20px;margin-top:16px}
.linkbtn{border:0;background:none;padding:4px 0;font-size:14.5px;color:var(--mute);text-decoration:underline;text-underline-offset:3px;cursor:pointer;white-space:nowrap}

/* kit */
.kgrid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.klist{display:grid;gap:16px}
.klist li{display:grid;gap:5px;justify-items:start}
.klist span{color:var(--ink2);font-size:16px}
.klist .mono{padding:3px 12px;border-radius:99px;border:1px solid var(--line2);font-size:14.5px;font-weight:500}
.stackc{margin-top:16px}
.stackhead{display:flex;justify-content:space-between;align-items:center;gap:14px;margin-bottom:10px}
.stackhead h3{margin:0}
.stack > div{display:grid;grid-template-columns:200px 1fr;gap:20px;padding:13px 0;border-top:1px solid var(--line)}
.stack dt{font-weight:600}
.stack dd{color:var(--ink2)}
.stackc .fine{margin-top:14px}

/* risks and decisions */
.risks{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.rk{padding:22px 24px;border-radius:22px;display:grid;gap:8px;align-content:start}
.rk dt{font-size:1.12rem;font-weight:600;letter-spacing:-.02em}
.rk dd{color:var(--ink2)}
.decide{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.dq{display:flex;gap:16px;align-items:flex-start;padding:22px 24px;border-radius:22px}
.dq h3{margin:0 0 6px;font-size:1.12rem;line-height:1.3}
.dq p{font-size:15.5px;color:var(--mute)}

footer{border-top:1px solid var(--line);padding:34px 0 46px;font-size:14.5px;color:var(--mute)}
footer p + p{margin-top:8px}
.src span{color:var(--ink2)}

/* ---------- tablet ---------- */
@media (max-width:1040px){
  .nav{display:none}
  .mode{margin-left:auto}
  .stages{grid-template-columns:repeat(2,1fr)}
  .score{grid-template-columns:repeat(3,1fr)}
  .blocks.n4{grid-template-columns:repeat(2,1fr)}
  .rhythm{grid-template-columns:repeat(2,1fr)}
}

  .tower .tnote{margin:0;flex-basis:100%}
  .span{height:auto;margin-left:38px;padding:10px 0;border-left:2.5px solid var(--acct)}
  .cable{display:none}
  .bnode{position:relative;left:auto!important;top:auto!important;margin:0 0 0 -21px;width:auto;height:auto;display:flex;align-items:center;gap:14px;padding:8px 0;text-align:left}
  .bnode .bl{position:static;transform:none;display:flex;align-items:baseline;gap:8px;font-size:15.5px}
  .bnode .bl b{font-size:16px}
  .hint{text-align:left}
  .moves,.mathgrid,.finds,.cgrid,.bgrid,.kgrid,.risks,.decide,.signals{grid-template-columns:1fr}
  .loopwrap{grid-template-columns:1fr;padding:30px 22px}
  .blocks.n3,.blocks.n2{grid-template-columns:1fr}
  .msgpanel{grid-template-columns:1fr;gap:20px}
  .slots{grid-template-columns:repeat(3,1fr)}
}
/* ---------- phone ---------- */
@media (max-width:600px){
  :root{--pad:18px;--r:24px}
  body{font-size:16.5px}
  .bar-in{height:60px;gap:10px}
  .bar .pill.sm{height:42px;padding:0 5px 0 16px;font-size:14.5px}
  .bar .pill.sm .orb{width:32px;height:32px}
  .mode{width:38px;height:38px}
  .heroin{padding:48px 0 44px}
  .ctas .pill{height:52px}
  .sec{padding-top:72px}
  .sec.tight{padding-top:52px}
  .sec.last{padding-bottom:72px}
  .shead{margin-bottom:30px;gap:14px}
  .card,.daypanel,.msgwrap,.shift{padding:22px}
  .chart{padding:22px 14px 18px}
  .bars{height:200px}
  .ml{font-size:10px}
  .call{font-size:12px}
  .call.end{margin-bottom:44px}
  .slots{grid-template-columns:repeat(2,1fr)}
  .need{grid-template-columns:1fr;gap:4px}
  .need dd{margin-bottom:12px}
  .daytabs{gap:2px;padding:5px}
  .dtab{min-width:0;height:52px}
  .dtab b{font-size:14.5px}
  .dtab span{font-size:12px}
  .dayhead{flex-direction:column;gap:6px}
  .daybar em{display:none}
  .daybar{height:10px;margin:20px 0 12px}
  .blocks.n4{grid-template-columns:1fr}
  .blk{padding:18px}
  .donewhen{flex-direction:column;gap:8px}
  .tp{grid-template-columns:1fr}
  .tpo{padding:12px}
  .rhythm{grid-template-columns:1fr 1fr;gap:10px}
  .ry{padding:18px}
  .qi{grid-template-columns:1fr;gap:12px;padding:20px}
  .qmeta{display:flex;align-items:center;gap:10px}
  .stages{grid-template-columns:1fr}
  .ladder{flex-direction:column;align-items:stretch;height:auto;gap:12px}
  .rung{height:auto;flex-direction:column;gap:5px}
  .rung .post{height:38px;width:max(92px,var(--h));padding:0 14px;align-items:center;justify-content:flex-start;border-radius:10px}
  .rung > span{min-height:0;font-size:14px}
  .score{grid-template-columns:1fr 1fr;gap:10px}
  .sc{padding:16px}
  .sc:last-child{grid-column:1 / -1}
  .scorefoot{flex-direction:column;gap:10px}
  .stack > div{grid-template-columns:1fr;gap:3px}
  .stackhead{flex-direction:column;align-items:flex-start}
  .dq{padding:20px}
  .shiftrow{flex-direction:column;gap:6px}
  .bubble{padding:18px 20px;font-size:15.5px}
  .loop{width:min(100%,300px)}
  .ln{padding:6px 12px;font-size:13.5px}
}
@media (max-width:380px){
  .brand .by{display:none}
  .dtab b{font-size:13.5px}
}
@media (prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .loop .runner{animation:none}
  .pill::after{display:none}
  .pill,.orb,.slot,.slot .sk,.meter i{transition:none}
}

<body>
<a class="skip" href="#top">Skip to the plan</a>
<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="#top"><span>Evo Bridge</span> <span class="by">plan</span></a>
    <nav class="nav" id="nav" aria-label="Sections"></nav>
    <button class="mode" id="mode" type="button" aria-label="Switch between dark and light"><i aria-hidden="true"></i></button>
    <a class="pill sm pri" href="#week"><span>The 7 days</span><span class="orb" aria-hidden="true"></span></a>
  </div>
</header>

<main id="top">
  <section class="hero" id="hero"></section>
  <div id="sections"></div>
</main>

<footer><div class="wrap" id="foot"></div></footer>
<noscript><p style="padding:40px;font-family:sans-serif">This page needs JavaScript to draw the plan.</p></noscript>

<script>
/* Draws the whole page from the PLAN block. No words live in this file, only how they are laid out. */
(function () {
  var P = PLAN;
  function $(s, r) { return (r || document).querySelector(s); }
  function $$(s, r) { return [].slice.call((r || document).querySelectorAll(s)); }
  function esc(s) { return String(s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function rich(s) { return esc(s).replace(/\*([^*]+)\*/g, '<span class="it">$1</span>'); }
  function money(n) { return '$' + Number(n).toLocaleString('en-US'); }
  function hrs(min) { var h = Math.floor(min / 60), m = min % 60; return (h ? h + 'h' : '') + (h && m ? ' ' : '') + (m ? m + 'm' : ''); }
  var CHEV = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M7.5 4.5 13 10l-5.5 5.5"/></svg>';
  var TICK = '<svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 10.5 8.5 14.5 15.5 6"/></svg>';

  /* saved ticks and numbers. If the browser blocks storage, the page still works, it just forgets. */
  function load(key, fallback) { try { var v = JSON.parse(localStorage.getItem(key) || 'null'); return v === null ? fallback : v; } catch (e) { return fallback; } }
  function save(key, val) { try { localStorage.setItem(key, JSON.stringify(val)); } catch (e) {} }

  function head(title, intro) {
    return '<div class="shead"><h2 class="h2 grad">' + rich(title) + '</h2>' + (intro ? '<p class="lede">' + esc(intro) + '</p>' : '') + '</div>';
  }
  function pill(label, href, cls) {
    return '<a class="pill ' + (cls || '') + '" href="' + esc(href) + '"><span>' + esc(label) + '</span>' + (cls === 'ghost' ? '' : '<span class="orb" aria-hidden="true">' + CHEV + '</span>') + '</a>';
  }
  function sec(id, inner, cls) { return '<section class="sec ' + (cls || '') + '" id="' + id + '"><div class="wrap">' + inner + '</div></section>'; }

  /* ---------- top bar ---------- */
  var NAV = [['numbers', 'Numbers'], ['strategy', 'Strategy'], ['week', 'The week'], ['messages', 'Messages'], ['content', 'Content'], ['bridge', 'Bridge'], ['kit', 'Kit']];
  $('#nav').innerHTML = NAV.map(function (n) { return '<a href="#' + n[0] + '">' + n[1] + '</a>'; }).join('');
  $$('.bar .orb').forEach(function (o) { o.innerHTML = CHEV; });
  $('#mode').addEventListener('click', function () {
    var t = document.documentElement.getAttribute('data-theme') === 'light' ? 'dark' : 'light';
    document.documentElement.setAttribute('data-theme', t);
    try { localStorage.setItem('evo-bridge-theme', t); } catch (e) {}
  });

  /* ---------- hero: the week drawn as a bridge ---------- */
  var H = P.hero, workdays = P.week.days.filter(function (d) { return d.node; });
  var Y0 = 14, SAG = 120, DECK = 176;
  function cableY(x) { return Y0 + SAG * 4 * x * (1 - x); }
  function tower(t, side) {
    return '<div class="tower ' + side + '"><span class="tn">' + esc(t.name) + '</span><b>' + esc(t.price) + '</b><span class="tnote">' + esc(t.note) + '</span></div>';
  }
  var hangers = '', nodes = '';
  workdays.forEach(function (d, i) {
    var x = (i + 1) / (workdays.length + 1), y = cableY(x);
    hangers += '<line class="hang" x1="' + (x * 1000).toFixed(1) + '" y1="' + y.toFixed(1) + '" x2="' + (x * 1000).toFixed(1) + '" y2="' + DECK + '"/>';
    nodes += '<button type="button" class="bnode" data-day="' + d.key + '" style="left:' + (x * 100).toFixed(2) + '%;top:' + y.toFixed(1) + 'px;--drop:' + (DECK - y).toFixed(1) + 'px" aria-label="Open ' + esc(d.d + ', ' + d.name) + '">' +
      '<span class="orb" aria-hidden="true">' + CHEV + '</span><span class="bl"><b>' + esc(d.d) + '</b><span>' + esc(d.node) + '</span></span></button>';
  });
  $('#hero').innerHTML =
    '<div class="heroin"><div class="wrap">' +
      '<div class="intro">' +
        '<p class="badge"><i></i><span>' + esc(H.badge) + '</span></p>' +
        '<h1 class="h1 grad">' + rich(H.h1) + '</h1>' +
        '<p class="lede">' + esc(H.lede) + '</p>' +
        '<div class="ctas">' + pill(H.primary, '#week', 'pri') + pill(H.ghost, '#numbers', 'ghost') + '</div>' +
      '</div>' +
      '<div class="bridge" role="group" aria-label="The week, drawn as a bridge from Evo Banners to Evo Funnels">' +
        tower(H.left, 'l') +
        '<div class="span"><svg class="cable" viewBox="0 0 1000 230" preserveAspectRatio="none" aria-hidden="true">' +
          '<path class="main" d="M0,' + Y0 + ' Q500,' + (Y0 + SAG * 2) + ' 1000,' + Y0 + '"/>' + hangers +
          '<line class="deck" x1="0" y1="' + DECK + '" x2="1000" y2="' + DECK + '"/></svg>' + nodes + '</div>' +
        tower(H.right, 'r') +
      '</div>' +
      '<p class="hint">' + esc(P.weekLabel) + '. ' + esc(H.hint) + '</p>' +
    '</div></div>';

  var out = [];

  /* ---------- what changed from version 1 ---------- */
  out.push(sec('shift',
    '<div class="shift"><h2 class="h3x grad">' + rich(P.shift.title) + '</h2><div class="shiftrows">' +
    P.shift.rows.map(function (r, i) { return '<div class="shiftrow' + (i ? ' now' : '') + '"><span class="tag' + (i ? ' on' : '') + '">' + esc(r[0]) + '</span><p>' + esc(r[1]) + '</p></div>'; }).join('') +
    '</div><p class="fine">' + esc(P.shift.note) + '</p></div>', 'tight'));

  /* ---------- 1. numbers ---------- */
  (function () {
    var N = P.numbers, C = N.chart, all = [];
    C.years.forEach(function (yr) { yr.v.forEach(function (v, i) { all.push({ y: yr.y, m: i, v: v, n: yr.n[i] }); }); });
    var max = Math.max.apply(null, all.map(function (a) { return a.v; }));
    var recentSum = all.slice(-C.recent).reduce(function (t, a) { return t + a.v; }, 0);
    var bars = all.map(function (a, i) {
      var best = a.y === C.best.y && a.m === C.best.m, recent = i >= all.length - C.recent;
      var h = a.v ? Math.max(2, a.v / max * 100) : 0;
      return '<div class="b' + (best ? ' best' : '') + (recent ? ' recent' : '') + (i && a.m === 0 ? ' newyear' : '') + '">' +
        '<div class="col">' + (best ? '<span class="call">' + esc(C.best.label) + '</span>' : '') + (i === all.length - 1 ? '<span class="call end">Last ' + C.recent + ' months: ' + money(recentSum) + '</span>' : '') +
        '<i style="height:' + h.toFixed(1) + '%"></i></div><span class="ml">' + 'JFMAMJJASOND'.charAt(a.m) + '</span></div>';
    }).join('');
    var table = '<table class="vh"><caption>Money in per month</caption><tbody>' + all.map(function (a) {
      return '<tr><th scope="row">' + ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'][a.m] + ' ' + a.y + '</th><td>' + money(a.v) + '</td><td>' + a.n + ' clients</td></tr>';
    }).join('') + '</tbody></table>';
    out.push(sec('numbers', head(N.title, N.intro) +
      '<figure class="chart card"><div class="bars" aria-hidden="true">' + bars + '</div>' +
      '<div class="years" aria-hidden="true">' + C.years.map(function (yr) { return '<span style="flex:' + yr.v.length + '">' + esc(yr.y) + '</span>'; }).join('') + '</div>' + table +
      '<figcaption>' + esc(C.caption) + '</figcaption></figure>' +
      '<div class="finds">' + N.findings.map(function (f) {
        return '<article class="card find"><p class="big grad">' + esc(f.big) + '</p><h3>' + esc(f.head) + '</h3><p>' + esc(f.text) + '</p><p class="move"><i></i><span>' + esc(f.move) + '</span></p></article>';
      }).join('') + '</div><p class="fine">' + esc(N.foot) + '</p>'));
  })();

  /* ---------- 2. strategy ---------- */
  (function () {
    var S = P.strategy, n = S.loop.length;
    var ring = S.loop.map(function (l, i) {
      var a = (-90 + i * 360 / n) * Math.PI / 180;
      return '<span class="ln' + (l === 'Deliver' ? ' door' : '') + '" style="left:' + (50 + 41 * Math.cos(a)).toFixed(2) + '%;top:' + (50 + 41 * Math.sin(a)).toFixed(2) + '%">' + esc(l) + '</span>';
    }).join('');
    out.push(sec('strategy', head(S.title) +
      '<ol class="moves">' + S.moves.map(function (m) {
        return '<li class="card mv"><span class="mvn">' + esc(m.n) + '</span><h3>' + esc(m.head) + '</h3><p>' + esc(m.text) + '</p></li>';
      }).join('') + '</ol>' +
      '<div class="loopwrap card">' +
        '<div class="loop" role="img" aria-label="The loop: ' + esc(S.loop.join(', then ')) + ', and around again">' +
          '<svg viewBox="0 0 200 200" aria-hidden="true"><circle class="track" cx="100" cy="100" r="82"/><circle class="runner" cx="100" cy="100" r="82"/></svg>' +
          '<span class="lc">' + S.loopCenter.map(esc).join('<br>') + '</span>' + ring + '</div>' +
        '<div class="door"><p class="doorhead">' + esc(S.branchNote) + '</p><ol>' + S.branch.map(function (b, i) {
          return '<li' + (i === S.branch.length - 1 ? ' class="end"' : '') + '>' + esc(b) + '</li>';
        }).join('') + '</ol></div>' +
      '</div>' +
      '<div class="notwk"><h3>' + esc(S.notTitle) + '</h3><div class="tags">' + S.not.map(function (x) { return '<span class="tag off">' + esc(x) + '</span>'; }).join('') + '</div><p class="fine">' + esc(S.notNote) + '</p></div>'));
  })();

  /* ---------- 3. the math ---------- */
  (function () {
    var M = P.math, slots = '';
    for (var i = 1; i <= M.slots; i++) slots += '<div class="slot" data-slot="' + i + '"><span class="sk">' + TICK + '</span><b>' + esc(M.slotLabel) + ' ' + i + '</b><span>$146</span></div>';
    out.push(sec('math', head(M.title, M.line) +
      '<div class="slots" id="slots">' + slots + '</div>' +
      '<div class="mathgrid">' +
        '<div class="card"><h3>Three ways to get there</h3><dl class="mix">' + M.mixes.map(function (m) { return '<div><dt>' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd></div>'; }).join('') + '</dl></div>' +
        '<div class="card"><h3>' + esc(M.needTitle) + '</h3><dl class="need">' + M.need.map(function (m) { return '<div><dt class="grad">' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd></div>'; }).join('') + '</dl></div>' +
      '</div>' +
      '<div class="mathgrid two">' +
        '<div class="card honest"><h3>' + esc(M.honestTitle) + '</h3><ul class="dots">' + M.honest.map(function (h) { return '<li>' + esc(h) + '</li>'; }).join('') + '</ul></div>' +
        '<div class="card capc"><h3>' + esc(M.capTitle) + '</h3><p>' + esc(M.cap) + '</p></div>' +
      '</div>'));
  })();

  /* ---------- 4. the week ---------- */
  (function () {
    var W = P.week;
    var tabs = W.days.map(function (d, i) {
      return '<button type="button" role="tab" class="dtab" id="tab-' + d.key + '" data-day="' + d.key + '" aria-controls="day-' + d.key + '" aria-selected="false" tabindex="-1"><b>' + esc(d.d) + '</b><span>' + esc(d.date.replace('Nov ', '')) + '</span></button>';
    }).join('');
    var panels = W.days.map(function (d) {
      var total = d.blocks.reduce(function (a, b) { return a + b.min; }, 0);
      var bar = total ? '<div class="daybar" aria-hidden="true">' + d.blocks.map(function (b) { return '<span class="k-' + b.k + '" style="flex:' + b.min + '"><em>' + esc(b.label) + ' ' + hrs(b.min) + '</em></span>'; }).join('') + '</div>' : '';
      var blocks = d.blocks.map(function (b, bi) {
        return '<div class="card blk k-' + b.k + '"><div class="blkhead"><h4><i></i>' + esc(b.label) + '</h4>' + (b.min ? '<span class="num">' + hrs(b.min) + '</span>' : '') + '</div><ul class="tasks">' +
          b.tasks.map(function (t, ti) {
            var id = d.key + '-' + bi + '-' + ti;
            return '<li><label class="task"><input type="checkbox" data-task="' + id + '"><span class="box">' + TICK + '</span><span class="tt">' + esc(t) + '</span></label></li>';
          }).join('') + '</ul></div>';
      }).join('');
      return '<div class="daypanel" role="tabpanel" id="day-' + d.key + '" aria-labelledby="tab-' + d.key + '" hidden>' +
        '<div class="dayhead"><div><p class="num">' + esc(d.d + ', ' + d.date) + (total ? ', ' + hrs(total) : '') + '</p><h3 class="dname">' + esc(d.name) + '</h3><p class="goal">' + esc(d.goal) + '</p></div><p class="prog" data-prog="' + d.key + '"></p></div>' +
        bar + (blocks ? '<div class="blocks n' + d.blocks.length + '">' + blocks + '</div>' : '') +
        '<div class="donewhen"><span class="tag ok">Done when</span><p>' + esc(d.done) + '</p></div>' +
        (d.claude ? '<p class="claude"><i></i><span>' + esc(d.claude) + '</span></p>' : '') + '</div>';
    }).join('');
    out.push(sec('week', head(W.title, W.intro) +
      '<div class="daytabs" role="tablist" aria-label="Days of the week">' + tabs + '</div>' + panels +
      '<p class="fine weekfoot">' + esc(W.order) + ' ' + esc(W.saveNote) + '</p>'));
  })();

  /* ---------- 5. messages ---------- */
  (function () {
    var M = P.messages;
    out.push(sec('messages', head(M.title, M.intro) +
      '<div class="msgwrap"><div class="mtabs" role="tablist" aria-label="Message types">' + M.tracks.map(function (t) {
        return '<button type="button" role="tab" class="mtab" id="mtab-' + t.key + '" data-track="' + t.key + '" aria-controls="msg-' + t.key + '" aria-selected="false" tabindex="-1">' + esc(t.tab) + '</button>';
      }).join('') + '</div>' +
      M.tracks.map(function (t) {
        return '<div class="msgpanel" role="tabpanel" id="msg-' + t.key + '" aria-labelledby="mtab-' + t.key + '" hidden>' +
          '<div class="msgside"><div class="tags"><span class="tag">' + esc(t.who) + '</span><span class="tag">' + esc(t.when) + '</span></div><p class="why">' + esc(t.why) + '</p>' + (t.note ? '<p class="fine">' + esc(t.note) + '</p>' : '') + '</div>' +
          '<div class="bubblewrap"><div class="bubble">' + esc(t.body).split('\n\n').map(function (p) { return '<p>' + p.replace(/\[([^\]]+)\]/g, '<mark>[$1]</mark>') + '</p>'; }).join('') + '</div>' +
          '<button type="button" class="pill sm copy" data-copy="' + t.key + '"><span>' + esc(M.copy) + '</span><span class="orb" aria-hidden="true">' + CHEV + '</span></button></div></div>';
      }).join('') + '</div>' +
      '<h3 class="subh">' + esc(M.signalsTitle) + '</h3><div class="signals">' + M.signals.map(function (s) {
        return '<div class="card sig ' + s.c + '"><h4><i></i>' + esc(s.name) + '</h4><p class="says">' + esc(s.says) + '</p><p>' + esc(s.do) + '</p></div>';
      }).join('') + '</div>' +
      '<div class="rulesrow"><h3 class="subh">' + esc(M.rulesTitle) + '</h3><div class="tags">' + M.rules.map(function (r) { return '<span class="tag">' + esc(r) + '</span>'; }).join('') + '</div><p class="fine">' + esc(M.skip) + '</p></div>'));
  })();

  /* ---------- 6. content ---------- */
  (function () {
    var C = P.content;
    out.push(sec('content', head(C.title, C.intro) +
      '<div class="twoposts card"><h3>' + esc(C.ruleTitle) + '</h3><div class="tp"><div class="tpo"><span>One order</span></div>' + C.rule.map(function (r) {
        return '<div class="tpp"><span class="num">' + esc(r[0]) + '</span><b>' + esc(r[1]) + '</b></div>';
      }).join('') + '</div></div>' +
      '<h3 class="subh">' + esc(C.rhythmTitle) + '</h3><div class="rhythm">' + C.rhythm.map(function (r) {
        return '<div class="card ry"><span class="num">' + esc(r.d) + '</span><h4>' + esc(r.k) + '</h4><p>' + esc(r.t) + '</p></div>';
      }).join('') + '</div>' +
      '<div class="cgrid"><div class="card"><h3>' + esc(C.routineTitle) + '</h3><ol class="steps">' + C.routine.map(function (r) { return '<li>' + esc(r) + '</li>'; }).join('') + '</ol></div>' +
      '<div class="card"><h3>' + esc(C.factsTitle) + '</h3><ul class="facts">' + C.facts.map(function (f) {
        return '<li><b>' + esc(f.t) + '</b><span>' + esc(f.d) + ' <a href="' + esc(f.u) + '" target="_blank" rel="noopener">' + esc(f.s) + '</a></span></li>';
      }).join('') + '</ul><p class="fine">' + esc(C.factsNote) + '</p></div></div>' +
      '<h3 class="subh">' + esc(C.queueTitle) + '</h3><ol class="queue">' + C.queue.map(function (q, i) {
        return '<li class="card qi"><div class="qmeta"><span class="num">' + esc(q.w + ', ' + q.d) + '</span><span class="tag k-' + q.k.toLowerCase().replace(/\s+/g, '') + '">' + esc(q.k) + '</span></div><div><p class="hook">' + esc(q.hook) + '</p><p class="how">' + esc(q.how) + '</p></div></li>';
      }).join('') + '</ol><p class="fine">' + esc(C.comments) + '</p>'));
  })();

  /* ---------- 7. the bridge ---------- */
  (function () {
    var B = P.bridge;
    out.push(sec('bridge', head(B.title, B.intro) +
      '<ol class="stages">' + B.stages.map(function (s, i) {
        return '<li class="card stage' + (i === 0 ? ' now' : '') + '"><span class="num">' + esc(s.when) + '</span><h3>' + esc(s.name) + '</h3><p>' + esc(s.text) + '</p><p class="gate"><span class="tag ' + (i === 0 ? 'hot' : '') + '">Gate</span><span>' + esc(s.gate) + '</span></p></li>';
      }).join('') + '</ol>' +
      '<div class="bgrid"><div class="card"><h3>' + esc(B.ladderTitle) + '</h3><div class="ladder">' + B.ladder.map(function (l, i) {
        return '<div class="rung' + (l.hot ? ' hot' : '') + (l.dim ? ' dim' : '') + '" style="--h:' + (22 + i * 19.5) + '%"><div class="post"><b>' + esc(l.p) + '</b></div><span>' + esc(l.n) + '</span></div>';
      }).join('') + '</div><p class="gap">' + esc(B.gap) + '</p><p class="fine">' + esc(B.gapNote) + '</p></div>' +
      '<div class="card"><h3>' + esc(B.shortTitle) + '</h3><dl class="need">' + B.short.map(function (m) { return '<div><dt class="grad">' + esc(m[0]) + '</dt><dd>' + esc(m[1]) + '</dd></div>'; }).join('') + '</dl><p class="gap">' + esc(B.shortRule) + '</p></div></div>'));
  })();

  /* ---------- 8. scoreboard ---------- */
  (function () {
    var S = P.score;
    out.push(sec('score', head(S.title, S.intro) +
      '<div class="score">' + S.items.map(function (it) {
        return '<div class="card sc" data-score="' + it.key + '"><label for="sc-' + it.key + '">' + esc(it.label) + '</label>' +
          '<div class="scrow"><button type="button" class="qb" data-d="-1" aria-label="Lower ' + esc(it.label) + '">&minus;</button>' +
          '<span class="scval">' + (it.money ? '<span class="cur">$</span>' : '') + '<input id="sc-' + it.key + '" type="number" inputmode="numeric" min="0" step="1" value="0"></span>' +
          '<button type="button" class="qb" data-d="1" aria-label="Raise ' + esc(it.label) + '">+</button></div>' +
          (it.goal ? '<div class="meter"><i></i></div><p class="num goal">Goal ' + (it.money ? money(it.goal) : it.goal) + '</p>' : '<div class="meter ghostm"><i></i></div><p class="num goal" id="rate">' + esc(S.rate) + ': 0%</p>') + '</div>';
      }).join('') + '</div>' +
      '<div class="scorefoot"><p class="fine">' + esc(S.note) + '</p><button type="button" class="linkbtn" id="reset">' + esc(S.reset) + '</button></div>'));
  })();

  /* ---------- 9. kit ---------- */
  (function () {
    var K = P.kit;
    out.push(sec('kit', head(K.title, K.intro) +
      '<div class="kgrid"><div class="card"><h3>Files</h3><ul class="klist">' + K.files.map(function (f) { return '<li><b>' + esc(f.n) + '</b><span>' + esc(f.d) + '</span></li>'; }).join('') + '</ul></div>' +
      '<div class="card"><h3>' + esc(K.skillsTitle) + '</h3><ul class="klist">' + K.skills.map(function (f) { return '<li><b class="mono">' + esc(f.n) + '</b><span>' + esc(f.d) + '</span></li>'; }).join('') + '</ul></div></div>' +
      '<div class="card stackc"><div class="stackhead"><h3>' + esc(K.stackTitle) + '</h3><span class="tag ok">' + esc(K.cost) + '</span></div><dl class="stack">' + K.stack.map(function (s) { return '<div><dt>' + esc(s[0]) + '</dt><dd>' + esc(s[1]) + '</dd></div>'; }).join('') + '</dl><p class="fine">' + esc(K.stackNote) + '</p></div>'));
  })();

  /* ---------- 10. risks ---------- */
  out.push(sec('risks', head(P.risks.title) + '<dl class="risks">' + P.risks.items.map(function (r) {
    return '<div class="card rk"><dt>' + esc(r.r) + '</dt><dd>' + esc(r.s) + '</dd></div>';
  }).join('') + '</dl>'));

  /* ---------- 11. decisions ---------- */
  out.push(sec('decide', head(P.decide.title, P.decide.intro) + '<ol class="decide">' + P.decide.items.map(function (d, i) {
    return '<li class="card dq"><span class="mvn">' + (i + 1) + '</span><div><h3>' + esc(d.q) + '</h3><p>' + esc(d.why) + '</p></div></li>';
  }).join('') + '</ol>', 'last'));

  $('#sections').innerHTML = out.join('');
  $('#foot').innerHTML = '<p>' + esc(P.foot.line) + ' ' + esc(P.version) + ', ' + esc(P.asOf) + '.</p><p class="src">Sources: ' + P.foot.sources.map(function (s) {
    return s[1] ? '<a href="' + esc(s[1]) + '" target="_blank" rel="noopener">' + esc(s[0]) + '</a>' : '<span>' + esc(s[0]) + '</span>';
  }).join(', ') + '.</p>';

  /* ---------- behaviour ---------- */
  /* tabs: click, plus left and right arrow keys */
  function tabset(tabSel, panelPrefix, attr, onPick) {
    var tabs = $$(tabSel);
    function pick(key, focus) {
      tabs.forEach(function (t) {
        var on = t.getAttribute(attr) === key;
        t.setAttribute('aria-selected', on ? 'true' : 'false'); t.tabIndex = on ? 0 : -1;
        var p = document.getElementById(panelPrefix + t.getAttribute(attr)); if (p) p.hidden = !on;
        if (on && focus) t.focus();
        if (on && t.scrollIntoView && t.parentNode.scrollWidth > t.parentNode.clientWidth) { var par = t.parentNode; par.scrollLeft = t.offsetLeft - (par.clientWidth - t.offsetWidth) / 2; }
      });
      if (onPick) onPick(key);
    }
    tabs.forEach(function (t, i) {
      t.addEventListener('click', function () { pick(t.getAttribute(attr)); });
      t.addEventListener('keydown', function (e) {
        var d = e.key === 'ArrowRight' ? 1 : e.key === 'ArrowLeft' ? -1 : 0; if (!d) return;
        e.preventDefault(); pick(tabs[(i + d + tabs.length) % tabs.length].getAttribute(attr), true);
      });
    });
    return pick;
  }
  var pickDay = tabset('.dtab', 'day-', 'data-day', function (key) {
    $$('.bnode').forEach(function (b) { b.classList.toggle('on', b.getAttribute('data-day') === key); });
  });
  var pickMsg = tabset('.mtab', 'msg-', 'data-track');
  pickDay(P.week.days[0].key); pickMsg(P.messages.tracks[0].key);

  /* a day on the bridge opens that day below */
  $$('.bnode').forEach(function (b) {
    b.addEventListener('click', function () {
      pickDay(b.getAttribute('data-day'));
      var w = document.getElementById('week'); if (w) w.scrollIntoView({ behavior: matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth', block: 'start' });
    });
  });

  /* ticks */
  var ticks = load('evo-bridge-ticks-v1', {});
  function progress() {
    P.week.days.forEach(function (d) {
      var boxes = $$('#day-' + d.key + ' input[type=checkbox]'), done = boxes.filter(function (b) { return b.checked; }).length;
      var el = $('[data-prog="' + d.key + '"]'); if (el) el.textContent = boxes.length ? done + ' of ' + boxes.length + ' done' : '';
      var tab = $('#tab-' + d.key); if (tab) tab.classList.toggle('alldone', boxes.length > 0 && done === boxes.length);
    });
  }
  $$('input[data-task]').forEach(function (b) {
    b.checked = !!ticks[b.getAttribute('data-task')];
    b.addEventListener('change', function () { ticks[b.getAttribute('data-task')] = b.checked; save('evo-bridge-ticks-v1', ticks); progress(); });
  });
  progress();

  /* scoreboard, and the order slots it fills */
  var score = load('evo-bridge-score-v1', {});
  function paint() {
    P.score.items.forEach(function (it) {
      var card = $('[data-score="' + it.key + '"]'), v = Math.max(0, parseInt(score[it.key], 10) || 0), inp = $('input', card);
      if (document.activeElement !== inp) inp.value = v;
      if (it.money) inp.style.width = (String(inp.value || 0).length + 0.6) + 'ch';
      var m = $('.meter i', card); if (m && it.goal) m.style.width = Math.min(100, v / it.goal * 100) + '%';
      card.classList.toggle('hit', !!it.goal && v >= it.goal);
    });
    var msgs = parseInt(score.msgs, 10) || 0, rep = parseInt(score.replies, 10) || 0, rate = msgs ? Math.round(rep / msgs * 100) : 0;
    var r = $('#rate'); if (r) r.textContent = P.score.rate + ': ' + rate + '%';
    var gm = $('[data-score="replies"] .meter i'); if (gm) gm.style.width = Math.min(100, rate * 2) + '%';
    var orders = parseInt(score.orders, 10) || 0;
    $$('#slots .slot').forEach(function (s) { s.classList.toggle('filled', parseInt(s.getAttribute('data-slot'), 10) <= orders); });
  }
  P.score.items.forEach(function (it) {
    var card = $('[data-score="' + it.key + '"]'), inp = $('input', card);
    function set(v) { score[it.key] = Math.max(0, v || 0); save('evo-bridge-score-v1', score); paint(); }
    $$('.qb', card).forEach(function (b) { b.addEventListener('click', function () { set((parseInt(score[it.key], 10) || 0) + parseInt(b.getAttribute('data-d'), 10) * (it.step || 1)); }); });
    inp.addEventListener('input', function () { set(parseInt(inp.value, 10)); });
    inp.addEventListener('blur', paint);
  });
  $('#reset').addEventListener('click', function () { score = {}; save('evo-bridge-score-v1', score); paint(); });
  paint();

  /* copy a message. No pop-ups: the button just says "Copied" for a moment. */
  $$('.copy').forEach(function (b) {
    b.addEventListener('click', function () {
      var t = P.messages.tracks.filter(function (x) { return x.key === b.getAttribute('data-copy'); })[0], label = $('span', b);
      function ok() { label.textContent = P.messages.copied; setTimeout(function () { label.textContent = P.messages.copy; }, 1600); }
      function fallback() {
        var ta = document.createElement('textarea'); ta.value = t.body; ta.setAttribute('readonly', ''); ta.style.cssText = 'position:fixed;top:0;left:-9999px';
        document.body.appendChild(ta); ta.select(); try { document.execCommand('copy'); ok(); } catch (e) {} document.body.removeChild(ta);
      }
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t.body).then(ok, fallback); else fallback();
    });
  });
})();
</script>
</body>
</html>
